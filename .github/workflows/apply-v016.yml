name: apply-v016
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply v0.1.6 patch
        run: |
          set -euo pipefail
          cat .github/v016/p0.b64 .github/v016/p1.b64 .github/v016/p2.b64 | tr -d '\n' | base64 -d | xz -d > /tmp/v016.patch
          git apply --check /tmp/v016.patch
          git apply /tmp/v016.patch
      - name: Verify file contents (git blob sha)
        run: |
          set -euo pipefail
          bad=0
          while read -r sha path; do
            got=$(git hash-object "$path")
            if [ "$got" != "$sha" ]; then echo "MISMATCH $path $got != $sha"; bad=1; else echo "ok $path"; fi
          done <<'EOF'
          287d22986718e187fc081af0788d87f67f3b50ca README.md
          0b0b6582edb4044b00f363bb60dac48ca8d8cf02 src/DiscardOddsPlugin.UI.cs
          b1a3766a7dec5e774fbdaebde35df6afc773c9a5 src/DiscardOddsPlugin.cs
          21c9eecd8d196db5d3f695600d9ad5fe288ed05b src/DrawMath.cs
          5edfb190b7ae8ba85fb2115778e090a988f6d405 src/GameReader.cs
          25c7a436a1dbfbdd62d3f5fd180084f8b9d80510 src/LethalEngine.cs
          ed3cb667cf5cb4bc62deff80016caf9f2a064eb9 src/PayoffWidget.cs
          4b1d1e00100f3ca3b30f46876cac6453ef32b566 src/ProbeLog.cs
          2a44f025713d7d372d64c5ac172509bd8ef4c5cc src/Probes.cs
          c114c237d4f6131cfa536bed97b2da9c8b88235f tests/OddsEngine.Tests/Program.cs
          0b0857f8c2a02457d3b98eeed3d67ff875c4bd3e tests/OddsEngine.Tests/OddsEngine.Tests.csproj
          EOF
          exit $bad
      - name: Unit tests
        run: |
          cd tests/OddsEngine.Tests
          dotnet run -c Release
      - name: Commit and remove one-shot files
        run: |
          set -euo pipefail
          git config user.name "Ray D Osborne"
          git config user.email "raydosborne@gmail.com"
          git rm -q .github/v016/p0.b64 .github/v016/p1.b64 .github/v016/p2.b64 .github/workflows/apply-v016.yml
          git add README.md src tests
          git commit -m "v0.1.6: Soularium odds/risk/result, next draw, payoffs left, lethal next draw estimate, luck score log, per-line toggles, README badges"
          git push
