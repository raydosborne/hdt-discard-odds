name: apply-v015
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply v0.1.5 patch
        run: |
          set -euo pipefail
          cat .github/v015/p0.b64 .github/v015/p1.b64 | tr -d '\n' | base64 -d | xz -d > /tmp/v015.patch
          git apply --check /tmp/v015.patch
          git apply /tmp/v015.patch
      - name: Verify file contents (git blob sha)
        run: |
          set -euo pipefail
          bad=0
          while read -r sha path; do
            got=$(git hash-object "$path")
            if [ "$got" != "$sha" ]; then echo "MISMATCH $path $got != $sha"; bad=1; else echo "ok $path"; fi
          done <<'EOF'
          b81414ad58e85e246445a58f1d0365a2e272cc36 README.md
          c181f7527aa3f1c4fdd28f76723dacc325d55d6d src/DiscardOddsPlugin.UI.cs
          b95c83f117e9f2b90c10803f04549343e3884869 src/DiscardOddsPlugin.cs
          13ac771e62813003ee53f405d30d02320df2953c src/OddsEngine.cs
          51d8bef5bdbe1f2fb85cac2606b6707f43bc471d src/PayoffWidget.cs
          218cfe954f8a865fd2410acfbd999b994bae8e56 src/ProbeLog.cs
          0d91534276bca354b3ad62529d56f6b5300202c3 src/TargetConfig.cs
          2291de21a9b7893ff1784bf888392fbf9f6369d0 src/WidgetPolicy.cs
          f66994284a39561b5cbe51368c47c67314d58752 tests/OddsEngine.Tests/Program.cs
          EOF
          exit $bad
      - name: Unit tests
        run: |
          cd tests/OddsEngine.Tests
          dotnet run -c Release
      - name: Commit and remove one-shot files
        run: |
          set -euo pipefail
          git config user.name "Ray D Osborne"
          git config user.email "raydosborne@gmail.com"
          git rm -q .github/v015/p0.b64 .github/v015/p1.b64 .github/workflows/apply-v015.yml
          git add README.md src tests
          git commit -m "v0.1.5: opener odds (1-drop or Cursed Catacombs, Entropic Continuity excluded, openerExtraHits), Missed X% line, Hand of Gul'dan removed, Show details off by default"
          git push
