name: apply-v018
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply v0.1.8 patch
        run: |
          set -euo pipefail
          cat .github/v018/p0.b64 .github/v018/p1.b64 .github/v018/p2.b64 | tr -d '\n' | base64 -d | xz -d > /tmp/v018.patch
          git apply --check /tmp/v018.patch
          git apply /tmp/v018.patch
      - name: Verify file contents (git blob sha)
        run: |
          set -euo pipefail
          bad=0
          while read -r sha path; do
            got=$(git hash-object "$path")
            if [ "$got" != "$sha" ]; then echo "MISMATCH $path $got != $sha"; bad=1; else echo "ok $path"; fi
          done <<'EOF'
          87c9ce67391360a3bd0d2a4f31f44e63205a085e README.md
          00aecb38ad146b5752329f14c7ddd70f10e3d88a src/DiscardOddsPlugin.UI.cs
          e57db6c802ae30fa2396132ff3d98a1f92e27e28 src/DiscardOddsPlugin.cs
          c96157f5e618c06bcdf1635b2ed563f6cb3edeec src/GameReader.cs
          1a4552022283ed2893b9cbaf138a097508b3f7fc src/LethalEngine.cs
          96787667f09f965b7fa137d3766bcde217cb72cd src/OddsEngine.cs
          f9837b6cbf5b88f00f670ec661afeb6e1c025033 src/PayoffWidget.cs
          b37100ce73cf8dedb885b8ef468ce14250e8979f src/ProbeLog.cs
          c94a3483c9ed6c9f370d7b97c79f2b9a34886952 src/TargetConfig.cs
          3bd79851c1e6a76860a5c0c352aec3a44467dbba src/WidgetPolicy.cs
          ae111176457481de9f137e5bf284ba757edd72b9 tests/OddsEngine.Tests/Program.cs
          EOF
          exit $bad
      - name: Unit tests
        run: |
          cd tests/OddsEngine.Tests
          dotnet run -c Release
      - name: Commit and remove one-shot files
        run: |
          set -euo pipefail
          git config user.name "Ray D Osborne"
          git config user.email "raydosborne@gmail.com"
          git rm -q .github/v018/p0.b64 .github/v018/p1.b64 .github/v018/p2.b64 .github/workflows/apply-v018.yml
          git add README.md src tests
          git commit -m "v0.1.8: LETHAL-only lethal display, Soulfire opener exclusion, flat Widget lines menu, equipped Chronoclaws line, master on/off switch, auto-hide without targets"
          git push
