name: restore-program-v013
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Program.cs
        run: |
          python3 <<'PY'
          import base64, gzip, pathlib
          b64 = """"""
          data = gzip.decompress(base64.b64decode(b64))
          pathlib.Path("tests/OddsEngine.Tests/Program.cs").write_bytes(data)
          print("wrote", len(data), "sha1", __import__("hashlib").sha1(b"blob %d\0"%len(data)+data).hexdigest())
          PY
          git config user.name "Ray D Osborne"
          git config user.email "raydosborne@gmail.com"
          git add tests/OddsEngine.Tests/Program.cs
          git commit -m "v0.1.3: restore Program.cs (always-ByChoice + CompactMode tests)"
          git push
          git rm .github/workflows/restore-program-v013.yml
          git commit -m "chore: remove one-shot Program restore workflow" || true
          git push
